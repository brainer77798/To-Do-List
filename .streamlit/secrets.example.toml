# Example Streamlit Secrets for TaskVault
# In production on Streamlit Community Cloud, enter these in the app's Secrets settings.
# For local development with PostgreSQL, rename this to secrets.toml or set environment variables.
# For local development with SQLite, no secrets are strictly required (defaults to local taskvault.db).

# PostgreSQL Database URL
# Format: postgresql+psycopg://username:password@hostname:5432/database_name?sslmode=require
DATABASE_URL = "postgresql+psycopg://postgres:your_password@db.example.supabase.co:5432/postgres?sslmode=require"

# Environment: "development" or "production"
# In "production", a DATABASE_URL is strictly required to prevent data loss.
APP_ENV = "development"

